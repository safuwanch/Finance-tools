<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber subscription tally import</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .settings-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .settings-row label {
            font-weight: bold;
            font-size: 14px;
        }
        .settings-row input, .settings-row select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 150px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre;
            overflow: auto;
            box-sizing: border-box;
            resize: vertical;
        }
        /* Table Grid Styles for Output */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: none; /* Hidden until generated */
            max-height: 500px;
            overflow-y: auto;
        }
        .data-grid {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: #fff;
        }
        .data-grid th, .data-grid td {
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            text-align: left;
            white-space: nowrap;
        }
        .data-grid th {
            background-color: #2c3e50;
            color: white;
            position: sticky;
            top: 0;
            font-weight: 600;
        }
        .data-grid tr:nth-child(even) {
            background-color: #f8fafc;
        }
        .data-grid tr:hover {
            background-color: #f1f5f9;
        }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 15px 0;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #219150;
        }
        .btn-secondary {
            background-color: #2980b9;
        }
        .btn-secondary:hover {
            background-color: #1c6696;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Uber subscription tally import</h2>

    <div class="settings-row">
        <label for="branchSelect">Branch:</label>
        <select id="branchSelect" onchange="updateVoucherDefault()">
            <option value="MUM">MUM (Mumbai)</option>
            <option value="BLR">BLR (Bengaluru)</option>
            <option value="HYD">HYD (Hyderabad)</option>
        </select>

        <label for="voucherNumber">Voucher Number:</label>
        <input type="text" id="voucherNumber" value="Mum Subc1">
        
        <label for="tdsRate">TDS Rate (%):</label>
        <input type="number" id="tdsRate" value="2" step="0.1">
    </div>

    <label for="inputData"><strong>Input Data (Paste from Excel)</strong></label>
    <textarea id="inputData" placeholder="Paste your 11 Excel columns here in this exact order:
1. Invoice Number
2. Invoice Date
3. Invoice Period
4. Place of Supply
5. Tax Point Date
6. Description
7. Tax
8. Tax Amount
9. Total Net Amount
10. Total Amount Payable
11. Drive Link"></textarea>

    <button class="btn" onclick="generateOutput()">Generate Tally Data ↓</button>

    <label id="outputLabel" style="display: none;"><strong>Output Data (Review and Copy)</strong></label>
    
    <div class="table-responsive" id="tableContainer">
        <table class="data-grid" id="outputTable">
            <!-- Grid data will be injected here -->
        </table>
    </div>
    
    <button class="btn btn-secondary" onclick="copyOutput()" id="copyBtn" style="display: none;">Copy Output for Excel</button>
</div>

<script>
    // Variable to hold raw text data for copying to clipboard
    let rawOutputData = "";

    // Helper function to automatically increment the voucher number (e.g. Mum Subc1 -> Mum Subc2)
    function getIncrementedVoucher(baseVoucher, index) {
        if (index === 0) return baseVoucher;
        
        // Find if the voucher ends with a number
        const match = baseVoucher.match(/^(.*?)(\d+)$/);
        if (match) {
            const prefix = match[1];
            const num = parseInt(match[2], 10) + index;
            return prefix + num;
        }
        // Fallback if no number at the end
        return baseVoucher + "-" + (index + 1);
    }

    // Automatically update the default voucher number when branch changes
    function updateVoucherDefault() {
        const branch = document.getElementById('branchSelect').value;
        const voucherInput = document.getElementById('voucherNumber');
        
        if (branch === 'MUM') voucherInput.value = 'Mum Subc1';
        if (branch === 'BLR') voucherInput.value = 'Blr Subc1';
        if (branch === 'HYD') voucherInput.value = 'Hyd Subc1';
    }

    function generateOutput() {
        const inputStr = document.getElementById('inputData').value.trim();
        const branch = document.getElementById('branchSelect').value;
        const baseVoucherNumber = document.getElementById('voucherNumber').value.trim();
        const tdsRate = parseFloat(document.getElementById('tdsRate').value) || 2;
        
        if (!inputStr) {
            alert("Please paste some input data first.");
            return;
        }

        const lines = inputStr.split('\n');
        
        // Output headers for raw tab-separated text
        let outputLines = [];
        const headerRow = "Voucher Date\tVoucher Type Name\tVoucher Number\tLedger Name\tLedger Amount\tLedger Amount Dr/Cr\tReference No.\tReference Date\tVoucher Narration";
        outputLines.push(headerRow);

        // HTML Grid Headers
        let tableHTML = `
            <thead>
                <tr>
                    <th>Voucher Date</th>
                    <th>Voucher Type</th>
                    <th>Voucher Number</th>
                    <th>Ledger Name</th>
                    <th>Ledger Amount</th>
                    <th>Dr/Cr</th>
                    <th>Reference No.</th>
                    <th>Reference Date</th>
                    <th>Voucher Narration</th>
                </tr>
            </thead>
            <tbody>
        `;

        // Skip header line if it exists
        let startIndex = 0;
        if (lines[0].toLowerCase().includes('invoice')) {
            startIndex = 1;
        }

        let validInvoiceCount = 0;

        for (let i = startIndex; i < lines.length; i++) {
            if (!lines[i].trim()) continue; 
            
            const cols = lines[i].split('\t').map(c => c.trim());
            
            // Need at least 10 columns. 11th is the Drive link.
            if (cols.length < 10) continue; 
            
            // Increment the voucher number for each distinct invoice
            const currentVoucherNumber = getIncrementedVoucher(baseVoucherNumber, validInvoiceCount);
            validInvoiceCount++;

            const invNo = cols[0];
            const invDate = cols[1];
            const period = cols[2];
            const placeOfSupplyRaw = cols[3];
            
            // Extract state name (e.g., "Maharashtra (27)" -> "Maharashtra")
            const state = placeOfSupplyRaw.split('(')[0].trim(); 
            
            const description = cols[5];
            const taxDesc = cols[6];
            
            // Clean numbers
            const rawTotalPayable = parseFloat(cols[9].replace(/,/g, ''));
            
            // Extract Drive Link (Column 11 / index 10) if it exists
            const driveLink = cols.length > 10 ? cols[10] : "";
            
            // Recalculate amounts
            let taxPercent = 18; 
            const taxMatch = taxDesc.match(/(\d+)%/);
            if (taxMatch) taxPercent = parseFloat(taxMatch[1]);
            
            const netAmountExact = rawTotalPayable / (1 + (taxPercent / 100));
            const netAmountRounded = netAmountExact.toFixed(2);
            const taxAmountRounded = (rawTotalPayable - parseFloat(netAmountRounded)).toFixed(2);
            
            // TDS Calculation
            const tdsAmount = Math.round(parseFloat(netAmountRounded) * (tdsRate / 100));
            
            // Vendor Payable
            const vendorPayable = rawTotalPayable - tdsAmount;
            
            // Build Narration
            let narration = `Being Subscription Fee Invoice accounting for the period of  ${period}`;
            if (driveLink) {
                narration += ` - Link: ${driveLink}`;
            }
            
            // Line 1: Expense (Dr) - Dynamically uses Branch
            const row1 = [invDate, 'Journal', currentVoucherNumber, `UBER_Subscription Fee/Platform Fee_${branch}`, netAmountRounded, 'Dr', invNo, invDate, narration];

            // Line 2: Tax (Dr) - Dynamically uses Branch
            let taxLedgerName = `INPUT ${taxDesc.split(' ')[0]}- ${branch}`; 
            const row2 = [invDate, 'Journal', currentVoucherNumber, taxLedgerName, taxAmountRounded, 'Dr', invNo, invDate, narration];

            // Line 3: TDS (Cr)
            const row3 = [invDate, 'Journal', currentVoucherNumber, `TDS 194C ${tdsRate}%`, tdsAmount, 'Cr', invNo, invDate, narration];

            // Line 4: Vendor (Cr) - Dynamically uses Place of Supply state
            const row4 = [invDate, 'Journal', currentVoucherNumber, `Uber India Systems Pvt Ltd_${state}`, vendorPayable, 'Cr', invNo, invDate, narration];

            // Add lines to text output and HTML table rows
            const entries = [row1, row2, row3, row4];
            entries.forEach(row => {
                outputLines.push(row.join('\t'));
                tableHTML += "<tr><td>" + row.join("</td><td>") + "</td></tr>";
            });
        }

        tableHTML += "</tbody>";
        
        // Update DOM
        document.getElementById('outputTable').innerHTML = tableHTML;
        document.getElementById('tableContainer').style.display = 'block';
        document.getElementById('outputLabel').style.display = 'block';
        document.getElementById('copyBtn').style.display = 'inline-block';
        
        // Save the raw data so the copy button grabs tab-separated data, not HTML
        rawOutputData = outputLines.join('\n');
    }

    function copyOutput() {
        if (!rawOutputData) {
            alert("No data to copy.");
            return;
        }
        
        // Create a temporary text area to copy the tab-separated format accurately
        const tempTextArea = document.createElement('textarea');
        tempTextArea.value = rawOutputData;
        document.body.appendChild(tempTextArea);
        tempTextArea.select();
        document.execCommand('copy');
        document.body.removeChild(tempTextArea);
        
        alert("Copied to clipboard! You can now paste this directly into Excel.");
    }
</script>

</body>
</html>
