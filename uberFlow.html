<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber Flow - Horizontal Grid & Dynamic Tree</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- JSpreadsheet / JSuites -->
    <script src="https://cdn.jsdelivr.net/npm/jsuites/dist/jsuites.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsuites/dist/jsuites.min.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce/dist/index.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce/dist/jspreadsheet.min.css" type="text/css" />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --tree-font-size: 14px;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Grid Overrides for compact horizontal viewing */
        .jexcel > tbody > tr > td { font-size: 13px; padding: 4px 8px; white-space: nowrap; }
        
        /* Tree styling & sizing variables */
        .tree-line { border-left: 1px solid #cbd5e1; margin-left: 12px; padding-left: 12px; border-radius: 0 0 0 4px; }
        .node-hover:hover { background-color: #f1f5f9; }
        .tree-text { font-size: var(--tree-font-size); }
        .tree-amount { font-size: var(--tree-font-size); }
        .tree-icon { width: calc(var(--tree-font-size) * 1.15); height: calc(var(--tree-font-size) * 1.15); }
        .toggle-icon { width: calc(var(--tree-font-size) * 1); height: calc(var(--tree-font-size) * 1); }
        
        /* Custom scrollbars to save space */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Floating panel transition */
        #floating-panel {
            transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hidden-panel {
            opacity: 0;
            pointer-events: none;
            transform: translateY(15px) scale(0.97);
        }
        .visible-panel {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body class="h-screen w-screen bg-white flex flex-col overflow-hidden text-slate-800">

    <!-- Compact Header -->
    <header class="h-10 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0 shadow-md z-10">
        <div class="flex items-center gap-2 text-white">
            <i data-lucide="layout-grid" class="w-4 h-4 text-blue-400"></i>
            <h1 class="text-sm font-semibold tracking-wide">Uber Statement Analyzer</h1>
        </div>
        <div class="text-[11px] text-slate-300 flex items-center gap-2 bg-slate-800 px-2 py-1 rounded">
            <i data-lucide="info" class="w-3 h-3 text-blue-400"></i>
            Paste your 2-row data directly into the grid below
        </div>
    </header>

    <!-- Top Pane: Horizontal Spreadsheet -->
    <section class="border-b border-slate-200 bg-slate-50 flex flex-col shrink-0" style="height: 145px;">
        <div class="bg-slate-100 px-3 py-1.5 text-[11px] font-semibold text-slate-600 border-b border-slate-200 flex justify-between uppercase tracking-wider items-center">
            <span>Input Grid (2-Row Format)</span>
            <div class="flex items-center gap-3">
                <span class="text-slate-400 font-normal normal-case flex items-center gap-1">
                    <i data-lucide="zap" class="w-3 h-3"></i> Auto-Sync Active
                </span>
                <button onclick="clearGrid()" class="flex items-center gap-1 px-2 py-0.5 bg-white border border-slate-300 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 text-slate-500 rounded transition-colors shadow-sm cursor-pointer normal-case font-medium">
                    <i data-lucide="trash-2" class="w-3 h-3"></i> Clear Grid
                </button>
            </div>
        </div>
        <!-- Grid Container -->
        <div id="spreadsheet" class="flex-1 overflow-auto bg-white p-1"></div>
    </section>

    <!-- Bottom Pane: Tree Visualization -->
    <section class="flex-1 bg-white flex flex-col relative overflow-hidden">
        <div class="bg-slate-50 px-3 py-1.5 text-[11px] font-semibold text-slate-600 border-b border-slate-200 uppercase tracking-wider flex flex-wrap gap-2 justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="network" class="w-3 h-3"></i> Auto-Generated Hierarchy Tree
            </div>
            
            <div class="flex items-center gap-2">
                <!-- FONT SIZE ADJUSTMENT -->
                <div class="flex items-center gap-1 bg-white border border-slate-300 rounded px-1 py-0.5 shadow-sm" title="Adjust text size">
                    <span class="text-slate-400 font-bold px-1" style="font-size: 10px;">A</span>
                    <button onclick="adjustFontSize(-1)" class="px-1.5 hover:bg-slate-100 hover:text-blue-600 rounded transition-colors">-</button>
                    <span id="font-size-display" class="w-6 text-center text-[10px] normal-case text-slate-500">14px</span>
                    <button onclick="adjustFontSize(1)" class="px-1.5 hover:bg-slate-100 hover:text-blue-600 rounded transition-colors">+</button>
                </div>

                <div class="h-4 w-px bg-slate-300 mx-1"></div>

                <!-- EXPAND / COLLAPSE BUTTONS -->
                <button onclick="expandAll()" class="flex items-center gap-1 px-2 py-0.5 bg-white border border-slate-300 hover:bg-slate-100 hover:text-slate-700 text-slate-500 rounded transition-colors shadow-sm cursor-pointer normal-case font-medium">
                    <i data-lucide="chevrons-down" class="w-3 h-3"></i> Expand All
                </button>
                <button onclick="collapseAll()" class="flex items-center gap-1 px-2 py-0.5 bg-white border border-slate-300 hover:bg-slate-100 hover:text-slate-700 text-slate-500 rounded transition-colors shadow-sm cursor-pointer normal-case font-medium">
                    <i data-lucide="chevrons-up" class="w-3 h-3"></i> Collapse All
                </button>

                <div class="h-4 w-px bg-slate-300 mx-1"></div>

                <!-- COPY TO EXCEL BUTTON -->
                <button id="copy-excel-btn" onclick="copyTreeToExcel()" class="flex items-center gap-1.5 px-2 py-0.5 bg-white border border-slate-300 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 text-slate-500 rounded transition-colors shadow-sm cursor-pointer normal-case font-medium">
                    <i data-lucide="copy" class="w-3 h-3"></i> Copy to Excel
                </button>
            </div>
        </div>
        
        <!-- Tree Container -->
        <div id="tree-container" class="flex-1 overflow-auto p-6 pb-24 text-slate-800 bg-slate-50/50">
            <!-- Tree rendered here via JS -->
        </div>

        <!-- FLOATING ANALYSIS PANEL -->
        <div id="floating-panel" class="hidden-panel absolute bottom-8 right-8 w-80 bg-white shadow-2xl rounded-xl border border-slate-200 z-50 flex flex-col overflow-hidden">
            <div class="bg-slate-800 text-white px-4 py-3 flex justify-between items-start">
                <div class="pr-4">
                    <div class="text-[10px] text-blue-300 uppercase tracking-widest font-semibold mb-0.5" id="panel-parent">PARENT NODE</div>
                    <h3 id="panel-title" class="font-semibold text-sm leading-snug">Node Details</h3>
                </div>
                <button onclick="closePanel()" class="text-slate-400 hover:text-white transition-colors bg-slate-700 hover:bg-slate-600 p-1 rounded">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="p-5 flex flex-col gap-4">
                <div class="flex justify-between items-end border-b border-slate-100 pb-3">
                    <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Net Amount</span>
                    <span id="panel-amount" class="text-2xl font-bold tracking-tight text-slate-800">₹0.00</span>
                </div>
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Data Path Logic</span>
                    <div id="panel-id" class="text-[11px] font-mono text-slate-600 bg-slate-100 border border-slate-200 p-2 rounded mt-1.5 break-words">--</div>
                </div>
                <div id="panel-status-container" class="mt-1">
                    <!-- Status badges injected here -->
                </div>
                <!-- Mismatch Alert Box -->
                <div id="panel-mismatch-container" class="hidden mt-2 p-3 bg-amber-50 border border-amber-200 rounded-lg">
                    <div class="flex items-start gap-2">
                        <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600 mt-0.5"></i>
                        <div>
                            <h4 class="text-[10px] font-bold text-amber-800 uppercase tracking-wider">Math Mismatch</h4>
                            <p class="text-[11px] text-amber-700 mt-1 leading-snug" id="panel-mismatch-text"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        lucide.createIcons();

        // -------------------------------------------------------------
        // 1. DATA MODEL (Horizontal 2-Row Format)
        // -------------------------------------------------------------
        const initialData = [
            [952737.76, 16030.00, -29099.04, -1001718.68, -947647.43, -54071.25, 11055.91, 4719.93, 10998.33, 57.58, 608.68, 4111.25, 301.83, 37765.09, -1035.00, 3420.00, -1253.03, -31261.72, 17938.52, -15775.84],
            ["Total earnings : Net fare", "Total earnings : Promotions", "Refunds & Expenses", "Payouts", "Payouts : Cash collected", "Payouts : Transferred To Bank Account", "Paid to third parties", "Paid to Uber", "Paid to third parties:Paid to airport", "Paid to third parties:Railway pick-up fee", "Paid to Uber:Booking fee", "Paid to Uber:Booking Fee", "Total earnings:Other earnings:Adjustment", "Total earnings:Other earnings:Other", "Total earnings:Other fees:Platform fee", "Total earnings:Tip", "Total earnings:Taxes", "Refunds & Expenses:Expenses:Driver subscription charge", "Refunds & Expenses:Refunds:Toll", "Refunds & Expenses:Taxes:Tax"]
        ];

        let spreadsheetInstance = null;
        let globalNodeMap = {};
        let globalRootNodes = []; 

        let currentFontSize = 14;

        // -------------------------------------------------------------
        // 2. INITIALIZE JSPREADSHEET 
        // -------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            const jss = jspreadsheet(document.getElementById('spreadsheet'), {
                worksheets: [{
                    data: initialData,
                    minDimensions: [25, 2], 
                    tableOverflow: true,
                    tableWidth: "100%",
                    tableHeight: "100%",
                    defaultColWidth: 150,
                }],
                onchange: function() {
                    syncVisuals();
                }
            });

            spreadsheetInstance = Array.isArray(jss) ? jss[0] : jss;
            syncVisuals(); 
        });

        // -------------------------------------------------------------
        // 3. LOGIC: PARSE 2 ROWS -> DYNAMIC COLON HIERARCHY
        // -------------------------------------------------------------
        function syncVisuals() {
            if (!spreadsheetInstance) return;

            const rawData = spreadsheetInstance.getData();
            if (rawData.length < 2) return;

            let amountsRow, pathsRow;
            
            const colonsRow0 = rawData[0].filter(v => v && String(v).includes(':')).length;
            const colonsRow1 = rawData[1].filter(v => v && String(v).includes(':')).length;
            
            if (colonsRow0 > colonsRow1) {
                pathsRow = rawData[0];
                amountsRow = rawData[1];
            } else if (colonsRow1 > colonsRow0) {
                pathsRow = rawData[1];
                amountsRow = rawData[0];
            } else {
                const textRow0 = rawData[0].filter(v => v && isNaN(Number(v))).length;
                const textRow1 = rawData[1].filter(v => v && isNaN(Number(v))).length;
                
                if (textRow0 > textRow1) {
                    pathsRow = rawData[0];
                    amountsRow = rawData[1];
                } else {
                    amountsRow = rawData[0];
                    pathsRow = rawData[1];
                }
            }

            globalNodeMap = {};

            // Pass 1: Parse provided nodes
            for (let i = 0; i < pathsRow.length; i++) {
                if (!pathsRow[i] || String(pathsRow[i]).trim() === "") continue;
                
                const originalStr = String(pathsRow[i]);
                const parts = originalStr.split(':').map(p => p.trim());
                const keyPath = parts.map(p => p.toLowerCase()).join(':');
                
                let amt = parseFloat(String(amountsRow[i]).replace(/,/g, ''));
                if (isNaN(amt)) amt = 0;

                globalNodeMap[keyPath] = {
                    id: keyPath,
                    originalPath: originalStr,
                    label: parts[parts.length - 1], 
                    amount: amt,
                    children: [],
                    isExplicitlyProvided: true 
                };
            }

            // Pass 2: Create any missing implicit parent nodes
            Object.values(globalNodeMap).forEach(node => {
                const parts = node.id.split(':');
                for (let i = 1; i < parts.length; i++) {
                    const parentKey = parts.slice(0, i).join(':');
                    if (!globalNodeMap[parentKey]) {
                        const originalParts = node.originalPath.split(':').map(p=>p.trim());
                        globalNodeMap[parentKey] = {
                            id: parentKey,
                            originalPath: originalParts.slice(0, i).join(' : '),
                            label: originalParts[i - 1],
                            amount: 0,
                            children: [],
                            isExplicitlyProvided: false 
                        };
                    }
                }
            });

            // Pass 3: Link parents and children
            let rootNodes = [];
            Object.values(globalNodeMap).forEach(node => {
                const parts = node.id.split(':');
                if (parts.length > 1) {
                    const parentKey = parts.slice(0, -1).join(':');
                    globalNodeMap[parentKey].children.push(node);
                } else {
                    rootNodes.push(node);
                }
            });

            // Pass 4: Auto-Sum ONLY for implicit nodes
            function calculateRollups(node) {
                if (node.children.length === 0) return node.amount;
                
                let childrenSum = 0;
                node.children.forEach(child => {
                    childrenSum += calculateRollups(child);
                });

                if (!node.isExplicitlyProvided) {
                    node.amount = childrenSum;
                    node.autoSummed = true;
                } else {
                    const diff = Math.abs(node.amount - childrenSum);
                    if (diff > 0.05) { 
                        node.hasMismatch = true;
                        node.calculatedSum = childrenSum;
                        node.originalGridValue = node.amount;
                        node.mismatchDiff = diff;
                        
                        node.amount = childrenSum;
                    }
                }
                return node.amount;
            }

            rootNodes.forEach(root => calculateRollups(root));
            
            globalRootNodes = rootNodes;

            // Pass 5: Render DOM
            const container = document.getElementById('tree-container');
            container.innerHTML = ''; 
            rootNodes.forEach(root => {
                container.appendChild(createTreeNode(root));
            });
            
            lucide.createIcons();
        }

        // -------------------------------------------------------------
        // 4. DOM RENDERING FOR TREE
        // -------------------------------------------------------------
        function createTreeNode(node) {
            const div = document.createElement('div');
            const hasChildren = node.children.length > 0;
            const isNegative = node.amount < 0;
            const isZero = node.amount === 0;
            
            // Replaced generic US format with Indian Number System (en-IN)
            const formatCurrency = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(val);

            let amountColor = 'text-slate-400';
            if (isNegative) amountColor = 'text-rose-600';
            else if (!isZero) amountColor = 'text-emerald-600';

            const icon = hasChildren ? 'folder-open' : 'file-text';
            const iconColor = hasChildren ? 'text-blue-500' : 'text-slate-400';

            // Custom toggle button for expanding/collapsing
            const toggleHtml = hasChildren 
                ? `<div class="cursor-pointer p-0.5 hover:bg-slate-200 rounded toggle-btn transition-transform transform rotate-0" onclick="toggleNode(this, event)"><i data-lucide="chevron-down" class="toggle-icon text-slate-500"></i></div>`
                : `<div class="w-4"></div>`; // Empty spacer for leaf nodes to keep alignment

            const rowHtml = `
                <div class="flex items-center justify-between py-1.5 px-2 rounded cursor-pointer node-hover group border border-transparent hover:border-slate-200 transition-all duration-150" 
                     onclick="openPanel('${node.id}', event)">
                    <div class="flex items-center gap-2">
                        ${toggleHtml}
                        <i data-lucide="${icon}" class="tree-icon ${iconColor}"></i>
                        <span class="tree-text font-medium text-slate-700 group-hover:text-blue-600">${node.label}</span>
                        ${node.autoSummed ? `<span class="bg-blue-50 text-blue-500 border border-blue-100 text-[9px] uppercase px-1.5 py-0.5 rounded ml-1 tracking-wider hidden sm:inline-block">Auto-Sum</span>` : ''}
                        ${node.hasMismatch ? `<span class="bg-amber-50 text-amber-600 border border-amber-200 text-[9px] uppercase px-1.5 py-0.5 rounded ml-1 tracking-wider flex items-center gap-1" title="Math mismatch"><i data-lucide="alert-triangle" class="w-3 h-3"></i> Auto-Corrected</span>` : ''}
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="tree-amount font-semibold ${amountColor}">${formatCurrency(node.amount)}</span>
                    </div>
                </div>
            `;
            div.innerHTML = rowHtml;

            if (hasChildren) {
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'tree-line children-container';
                node.children.forEach(child => {
                    childrenContainer.appendChild(createTreeNode(child));
                });
                div.appendChild(childrenContainer);
            }

            return div;
        }

        // -------------------------------------------------------------
        // 5. INTERACTIVE CONTROLS (Expand/Collapse, Font Size, Panel)
        // -------------------------------------------------------------
        function toggleNode(btnElement, event) {
            event.stopPropagation();
            const rowDiv = btnElement.closest('div.justify-between');
            const childrenContainer = rowDiv.nextElementSibling;
            
            if (childrenContainer && childrenContainer.classList.contains('children-container')) {
                const isHidden = childrenContainer.classList.contains('hidden');
                if (isHidden) {
                    childrenContainer.classList.remove('hidden');
                    btnElement.classList.remove('-rotate-90');
                } else {
                    childrenContainer.classList.add('hidden');
                    btnElement.classList.add('-rotate-90');
                }
            }
        }

        function expandAll() {
            document.querySelectorAll('.children-container').forEach(el => el.classList.remove('hidden'));
            document.querySelectorAll('.toggle-btn').forEach(el => el.classList.remove('-rotate-90'));
        }

        function collapseAll() {
            document.querySelectorAll('.children-container').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.toggle-btn').forEach(el => el.classList.add('-rotate-90'));
        }

        function adjustFontSize(change) {
            currentFontSize += change;
            if (currentFontSize < 10) currentFontSize = 10;
            if (currentFontSize > 24) currentFontSize = 24;
            
            document.getElementById('font-size-display').innerText = currentFontSize + 'px';
            document.documentElement.style.setProperty('--tree-font-size', currentFontSize + 'px');
        }

        function openPanel(nodeId, event) {
            event.stopPropagation();
            const node = globalNodeMap[nodeId];
            if (!node) return;

            // Updated to Indian Number System formatting
            const formatCurrency = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(val);

            const pathParts = node.originalPath.split(':').map(p=>p.trim());
            const parentName = pathParts.length > 1 ? pathParts[pathParts.length - 2] : 'ROOT LEVEL';

            document.getElementById('panel-parent').innerText = parentName;
            document.getElementById('panel-title').innerText = node.label;
            document.getElementById('panel-id').innerText = node.originalPath;
            
            const amtEl = document.getElementById('panel-amount');
            amtEl.innerText = formatCurrency(node.amount);
            amtEl.className = `text-3xl font-bold tracking-tight ${node.amount < 0 ? 'text-rose-500' : (node.amount > 0 ? 'text-emerald-500' : 'text-slate-800')}`;

            const statusContainer = document.getElementById('panel-status-container');
            if (node.isExplicitlyProvided) {
                statusContainer.innerHTML = `<span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-1 rounded text-xs font-semibold"><i data-lucide="check-circle" class="w-3 h-3"></i> Value From Grid</span>`;
            } else if (node.autoSummed) {
                statusContainer.innerHTML = `<span class="inline-flex items-center gap-1 bg-blue-50 text-blue-700 border border-blue-200 px-2 py-1 rounded text-xs font-semibold"><i data-lucide="calculator" class="w-3 h-3"></i> Auto-Summed from Children</span>`;
            } else {
                statusContainer.innerHTML = '';
            }

            const mismatchContainer = document.getElementById('panel-mismatch-container');
            if (node.hasMismatch) {
                mismatchContainer.classList.remove('hidden');
                document.getElementById('panel-mismatch-text').innerHTML = `Grid Value: <strong class="line-through text-slate-500">${formatCurrency(node.originalGridValue)}</strong> (Overridden)<br>Sum of Children: <strong>${formatCurrency(node.calculatedSum)}</strong><br>Discrepancy: <strong class="text-red-600">${formatCurrency(node.mismatchDiff)}</strong>`;
            } else {
                mismatchContainer.classList.add('hidden');
            }

            lucide.createIcons();

            const panel = document.getElementById('floating-panel');
            panel.classList.remove('hidden-panel');
            panel.classList.add('visible-panel');
        }

        function closePanel() {
            const panel = document.getElementById('floating-panel');
            panel.classList.remove('visible-panel');
            panel.classList.add('hidden-panel');
        }

        // -------------------------------------------------------------
        // 6. UTILITY FUNCTIONS (Clear Grid & Export to Excel)
        // -------------------------------------------------------------
        function clearGrid() {
            if (!spreadsheetInstance) return;
            const emptyData = Array(2).fill().map(() => Array(25).fill(''));
            spreadsheetInstance.setData(emptyData);
            closePanel();
            syncVisuals();
        }

        function copyTreeToExcel() {
            if (!globalRootNodes || globalRootNodes.length === 0) return;

            function maxDepth(node, d) {
                if (!node.children || node.children.length === 0) return d;
                return Math.max(...node.children.map(c => maxDepth(c, d + 1)));
            }
            
            let depth = 1;
            globalRootNodes.forEach(root => {
                depth = Math.max(depth, maxDepth(root, 1));
            });

            const rows = [];
            const header = [];
            
            for (let i = 1; i <= depth; i++) {
                header.push(`Level ${i} Node`, `Amount`);
            }
            rows.push(header);

            function walk(node, level) {
                const cols = new Array(depth * 2).fill('');
                
                cols[level * 2] = node.label;
                cols[level * 2 + 1] = (node.amount !== undefined && !isNaN(node.amount)) ? node.amount.toFixed(2) : '';
                
                rows.push(cols);
                
                if (node.children && node.children.length > 0) {
                    node.children.forEach(child => walk(child, level + 1));
                }
            }

            globalRootNodes.forEach(root => walk(root, 0));

            const tsv = rows.map(row => row.join('\t')).join('\r\n');

            navigator.clipboard.writeText(tsv).then(() => {
                showCopySuccess();
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = tsv;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showCopySuccess();
            });
        }

        function showCopySuccess() {
            const btn = document.getElementById('copy-excel-btn');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = `<i data-lucide="check-circle-2" class="w-3 h-3"></i> Copied!`;
            btn.classList.add('bg-emerald-50', 'text-emerald-600', 'border-emerald-200');
            btn.classList.remove('bg-white', 'text-slate-500', 'border-slate-300', 'hover:bg-blue-50', 'hover:text-blue-600');
            lucide.createIcons();
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-emerald-50', 'text-emerald-600', 'border-emerald-200');
                btn.classList.add('bg-white', 'text-slate-500', 'border-slate-300', 'hover:bg-blue-50', 'hover:text-blue-600');
                lucide.createIcons();
            }, 2000);
        }
    </script>
